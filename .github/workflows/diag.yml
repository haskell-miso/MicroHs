name: x86 diag
on: push
jobs:
  alpine-x86:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: host info
      run: |
        uname -a; cat /etc/os-release | head -3
        cat /proc/cmdline
        grep -i ia32 /boot/config-$(uname -r) || true
        ls /proc/sys/abi 2>/dev/null; cat /proc/sys/abi/* 2>/dev/null || true
    - uses: jirutka/setup-alpine@v1
      with:
        arch: x86
        packages: make
    - run: uname -m; cat /etc/alpine-release
      shell: alpine.sh {0}
