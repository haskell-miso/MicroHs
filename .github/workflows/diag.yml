name: x86 diag
on: push
jobs:
  alpine-x86-sudows:
    runs-on: ubuntu-26.04
    steps:
    - run: ls -l /usr/bin/sudo* /etc/alternatives/sudo 2>&1 || true
    - name: use classic sudo (sudo-rs ignores -E)
      run: sudo update-alternatives --set sudo /usr/bin/sudo.ws
    - uses: jirutka/setup-alpine@v1
      with:
        arch: x86
        packages: make
    - run: uname -m; cat /etc/alpine-release
      shell: alpine.sh {0}
